name: Verify production deployment

on:
  deployment_status:

permissions:
  contents: read

jobs:
  verify-production:
    name: production deployment verification
    # Route every success through the trusted validator. Identity or payload
    # drift must fail visibly instead of being silently skipped at job level.
    if: github.event.deployment_status.state == 'success'
    concurrency:
      # Only a success carrying the expected bot/environment routing can cancel
      # an older production check. Rejected successes receive a run-unique group.
      group: >-
        ${{ github.event.deployment.creator.id == 68434857 &&
        github.event.deployment.payload.environmentId == '2255334a-771c-4024-a5b8-f7760f8d0144' &&
        'surf-production-deployment-verification' ||
        format('surf-rejected-deployment-{0}', github.run_id) }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the trusted verifier from main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
          path: verifier

      - name: Validate the deployment event before using its values
        id: deployment
        run: >-
          python3 verifier/.github/scripts/validate_deployment_event.py
          --event "$GITHUB_EVENT_PATH"
          --repository withnative/surf
          --repository-id 1333433853
          --environment-label 'native-learn / production'
          --environment-id 2255334a-771c-4024-a5b8-f7760f8d0144
          --bot-id 68434857
          --bot-login 'railway-app[bot]'
          --bot-node-id 'MDM6Qm90Njg0MzQ4NTc='
          --service-name native-learn
          --project-id f4d995a4-2c51-4860-8817-60f141b75b0c
          --github-output "$GITHUB_OUTPUT"
          --github-summary "$GITHUB_STEP_SUMMARY"

      - name: Require the deployed commit to belong to main
        env:
          DEPLOYED_SHA: ${{ steps.deployment.outputs.sha }}
        run: git -C verifier merge-base --is-ancestor "$DEPLOYED_SHA" origin/main

      - name: Check out the exact deployed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.deployment.outputs.sha }}
          persist-credentials: false
          path: deployed-source

      - name: Verify public production surfaces
        env:
          DEPLOYED_SHA: ${{ steps.deployment.outputs.sha }}
        run: >-
          python3 verifier/.github/scripts/verify_production_deployment.py
          --base-url https://surf.withnative.ai
          --expected-sha "$DEPLOYED_SHA"
          --repo-root deployed-source
          --legacy-url https://learn.withnative.ai
          --legacy-url https://agility.withnative.ai
          --github-summary "$GITHUB_STEP_SUMMARY"
